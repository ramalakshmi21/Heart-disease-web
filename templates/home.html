<!DOCTYPE html>
<html>
<head>
<title>Heart Disease Prediction</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="hero">
  <div class="card home-card">
    <h1>Heart Disease Prediction</h1>
    <p class="subtitle">Using Data Mining Algorithms</p>
    <div class="upload-box">
      <h2>Upload Your Dataset</h2>
      <p>Select your <b>heart_disease_fixed.arff</b> file</p>
      <form method="POST" enctype="multipart/form-data">
        <input type="file" name="dataset" accept=".arff,.csv" required>
        <button class="green" type="submit">Upload Dataset</button>
      </form>
    </div>
    <div class="note">Supported format: ARFF or CSV</div>
  </div>
</div>
{% with messages = get_flashed_messages() %}
{% if messages %}<div class="toast">{{ messages[0] }}</div>{% endif %}
{% endwith %}
</body>
</html>
